# jqwik, the engine that runs the property-based tests (the *Properties classes).
# Every property names its seed (io.github.astrapi69.random.Seeds.SEED), so the
# inputs are the same on every run. The test run database is switched off: with it,
# a failed run changes what the next run tries first, which makes one PIT mutant's
# result depend on the mutants before it.
jqwik.database =
# The default number of tries; a property that needs more or fewer says so.
jqwik.tries.default = 50
jqwik.reporting.onlyfailures = true
