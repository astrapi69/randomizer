buildscript {
    repositories {
        maven {
            url = projectRepositoriesMavenUrl
        }
    }
}

plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    id 'jacoco'
    alias(libs.plugins.gradle.versions.plugin)
    alias(libs.plugins.spotless.plugin.gradle)
    alias(libs.plugins.version.catalog.update)
    alias(libs.plugins.pitest.gradle.plugin)
}

group = "$groupPackage" as Object
version = "$projectVersion" as Object
description = "$rootProject.name"

// import gradle files
apply from: "gradle/dependencies.gradle"
apply from: "gradle/formatting.gradle"
apply from: "gradle/packaging.gradle"
apply from: "gradle/publishing.gradle"
apply from: "gradle/repositories.gradle"
apply from: "gradle/tagging.gradle"
apply from: "gradle/mutation-testing.gradle"
apply from: "gradle/testing.gradle"

// Mutation-score floor the CI build fails below: .github/workflows/gradle.yml
// runs `./gradlew pitest` after the build. Measured on 2026-10-17 (PIT 1.30.0,
// DEFAULTS): 346 of 368 mutants killed, 94.0 % strict and 94.8 % as PIT counts
// it, the same mutant by mutant in three runs; before the property-based tests
// 189 of 362 (52.2 % strict). The floor of 70 is the score the Gold tier of
// awesome-well-tested asks for, with a wide margin below the measured one; the
// mutants left and why: docs/MUTATION_TESTING.md.
// Kept here, not in gradle/mutation-testing.gradle, so that the floor sits in
// the file a reader (and awesome-well-tested's check) looks at.
pitest {
    mutationThreshold = 70
}
apply from: "gradle/version-catalog-update.gradle"

java {
    sourceCompatibility = "$projectSourceCompatibility" as Object
    toolchain {
        languageVersion = JavaLanguageVersion.of("$projectSourceCompatibility")
    }
}

tasks.named("test") {
    it.mustRunAfter(tasks.named("jar"))
}

tasks.withType(JavaCompile).configureEach { javaCompiler ->
    options.encoding = "UTF-8"
    // uncomment the next line for build with compiler argument -Xlint:deprecation
    // options.compilerArgs << "-Xlint:deprecation"
    // uncomment the next line for build with compiler argument -Xlint:unchecked
    // options.compilerArgs << "-Xlint:unchecked"
}
