pitest {
    junit5PluginVersion = libs.versions.pitest.junit5.plugin.version.get()
    pitestVersion = libs.versions.pitest.version.get()
    targetClasses = ["io.github.astrapi69.random.*"]
    threads = 4
    // The mutator set, named so a reader of the score knows it: DEFAULTS is what
    // PIT runs when nothing is said.
    mutators = ["DEFAULTS"]
    // jqwik shrinks a failing property to a smaller input, which can take longer than
    // PIT's timeout; the mutant then counts as TIMED_OUT instead of KILLED. Under PIT
    // only that a property fails matters, so the minion runs them without shrinking;
    // JUnit Platform takes the setting from the system properties.
    jvmArgs = ["-Djqwik.shrinking.default=OFF"]
    // XML is what the mutation-context step in .github/workflows/gradle.yml reads.
    outputFormats = ["HTML", "XML"]
    timestampedReports = false
}
